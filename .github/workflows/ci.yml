name: CI

# Type check, tests and production build on every push and pull request. None of it needs credentials: the tests run
# against an in-memory database, an in-process Postgres for the SQL migrations, and stand-ins for WhatsApp and the AI.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Takes the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No unresolved merge conflicts
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>) ' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.sql' --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "::error::Conflict markers found. Resolve the merge before pushing."
            exit 1
          fi

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
